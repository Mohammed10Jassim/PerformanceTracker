# Application
spring.application.name=PerformanceTracker

#profile
spring.profiles.active = dev

#port
server.port=8080

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.root=INFO
logging.level.com.pt.PerformanceTracker=INFO

management.endpoints.web.exposure.include=health,info
# Comma-separated trusted frontend origins; override CORS_ALLOWED_ORIGINS per environment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.0.57,http://192.168.0.57:*,https://192.168.0.213:*,https://192.168.0.229:*,https://192.168.0.57,https://192.168.0.57:*}
