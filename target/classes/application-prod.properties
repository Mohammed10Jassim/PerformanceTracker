# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Keycloak Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

# Keycloak Admin API
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM}
keycloak.admin.target-realm=${KEYCLOAK_TARGET_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Logging
logging.level.root=INFO
logging.level.com.pt.PerformanceTracker=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# CORS: trusted frontend origin(s) for production. Override with CORS_ALLOWED_ORIGINS
# (comma-separated; exact origins or patterns such as http://192.168.0.57:*).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://192.168.0.57,http://192.168.0.57:*,https://192.168.0.57,https://192.168.0.57:*}
